name: Publish desktop clients
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac -- --arm64 --x64 --publish never
            core: npm run core:mac
            files: release/*.dmg
          - os: windows-latest
            command: npm run dist:win -- --x64 --publish never
            core: npm run core:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag and package version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - name: Fetch and verify Mihomo core
        shell: bash
        run: ${{ matrix.core }}
      - name: Build installers
        shell: bash
        run: |
          sign_args=()
          if [[ -n "$MAC_P12" ]]; then
            export CSC_LINK="$MAC_P12"
            export CSC_KEY_PASSWORD="$MAC_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APP_PASSWORD"
            export APPLE_TEAM_ID="$MAC_TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              sign_args=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
            fi
          fi
          ${{ matrix.command }} "${sign_args[@]}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shopt -s nullglob
            apps=(release/mac*/Jokerdeck\ Switch.app)
            test "${#apps[@]}" -eq 2
            for app in "${apps[@]}"; do
              codesign --verify --deep --strict "$app"
              codesign --verify --strict "$app/Contents/Resources/helpers/Open Computer Use.app"
            done
          fi
        env:
          MAC_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: npm run site:manifest
      - name: Upload installers and switch website manifest
        env:
          DEPLOY_HOST: ${{ secrets.CLIENT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CLIENT_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.CLIENT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CLIENT_DEPLOY_KNOWN_HOSTS }}
          SITE_DIR: ${{ vars.CLIENT_SITE_DIR }}
          DOWNLOAD_DIR: ${{ vars.CLIENT_DOWNLOAD_DIR }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$SITE_DIR" && test -n "$DOWNLOAD_DIR"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$SITE_DIR' '$DOWNLOAD_DIR'"
          rsync -av release/*.dmg release/*.exe "$DEPLOY_USER@$DEPLOY_HOST:$DOWNLOAD_DIR/"
          scp site/index.html "$DEPLOY_USER@$DEPLOY_HOST:$SITE_DIR/index.html.next"
          scp assets/icon.png "$DEPLOY_USER@$DEPLOY_HOST:$SITE_DIR/icon.png.next"
          scp release/latest.json "$DEPLOY_USER@$DEPLOY_HOST:$DOWNLOAD_DIR/switch-latest.json.next"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mv '$SITE_DIR/icon.png.next' '$SITE_DIR/icon.png' && mv '$SITE_DIR/index.html.next' '$SITE_DIR/index.html' && mv '$DOWNLOAD_DIR/switch-latest.json.next' '$DOWNLOAD_DIR/switch-latest.json'"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/latest.json
          body_path: release/release-notes.md
